<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professor</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: #15120f; color: #eee7dc;
         display: flex; flex-direction: column; min-height: 100vh; }
  #stage { flex: 1; display: flex; gap: 3vw; padding: 3vh 5vw 0; box-sizing: border-box; min-height: 60vh; }
  #text { flex: 1 1 100%; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  #stage.has-figure #text { flex-basis: 40%; }
  #fig { flex: 0 0 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #stage.has-figure #fig { flex-basis: 56%; }
  #fig svg { max-width: 100%; max-height: 64vh; height: auto; }
  #fig .figure-error { color: #e0a080; font-size: 15px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  #place { color: #a08a70; font-size: 16px; }
  #title { font-size: 44px; font-weight: 700; margin: .2em 0; line-height: 1.15; }
  #stage.has-figure #title { font-size: 34px; }
  #body { font-size: 22px; color: #e3d8c8; white-space: pre-wrap; }
  #code { font: 16px/1.45 ui-monospace, monospace; background: #1f1a15; padding: 12px 14px; border-radius: 6px;
          overflow: auto; max-height: 40vh; margin: .6em 0 0; }
  #sources { color: #a08a70; font-size: 14px; margin-top: 1em; }
  #body:empty, #code:empty, #sources:empty { display: none; }
  #caption { font-size: 24px; color: #d8cbb8; min-height: 3.2em; padding: 1.5vh 5vw 0; }
  #bar { display: flex; gap: 12px; padding: 12px 5vw; background: #1f1a15; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #5a4a3a; background: #2a231c; color: inherit; cursor: pointer; }
  button[hidden] { display: none; }
  #state { display: flex; align-items: center; gap: 8px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #a08a70; flex: none; }
  .speaking #dot { background: #8fbf7f; }
  .thinking #dot { background: #e0c070; animation: pulse 1s infinite alternate; }
  .stuck #dot, .disconnected #dot { background: #e07a5f; }
  @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
  #message { color: #c9b79f; font-size: 15px; }
  #notices { padding: 0 5vw 10px; background: #1f1a15; }
  #notices div { color: #e0a080; font-size: 15px; padding-top: 4px; }
</style>
<script src="/static/mermaid.min.js"></script>
</head>
<body>
<div id="stage">
  <div id="text">
    <div id="place"></div>
    <div id="title">Connecting…</div>
    <div id="body"></div>
    <pre id="code"></pre>
    <div id="sources"></div>
  </div>
  <div id="fig"></div>
</div>
<div id="caption"></div>
<div id="bar">
  <div id="state"><span id="dot"></span><strong id="label"></strong></div>
  <span id="message"></span>
  <span style="flex:1"></span>
  <button id="sound" hidden>Turn sound on</button>
  <button id="retry" hidden>Try again</button>
  <button id="start" hidden>Start</button>
  <button id="pause" hidden>Pause</button>
</div>
<div id="notices"></div>
<script>
const $ = id => document.getElementById(id);
mermaid.initialize({
  startOnLoad: false, theme: "dark", securityLevel: "strict",
  themeVariables: { fontSize: "18px", primaryColor: "#2a231c", primaryTextColor: "#eee7dc",
                    primaryBorderColor: "#a08a70", lineColor: "#c9b79f", background: "#15120f" },
  flowchart: { useMaxWidth: true, htmlLabels: true }, sequence: { useMaxWidth: true },
});

const LABELS = { ready: "Ready", thinking: "Thinking…", speaking: "Speaking", listening: "Listening",
                 paused: "Paused", stuck: "Can't go on", ended: "Ended", disconnected: "Disconnected" };
let ws = null;
const send = obj => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); };

let state = "ready", place = null, figureSeq = 0;
// The lecture paces the speech, so the queue rarely holds more than one clip. It
// is still a queue: a clip that arrives early waits its turn and is never overlapped.
const queue = [];
let current = null;          // the clip playing now: {audio, timer, done}
let soundOn = true;

// What the lecturer is doing right now. Silence always has one of these beside it.
function showState(s, message) {
  state = s;
  document.body.className = s;
  $("label").textContent = LABELS[s] || s;
  $("message").textContent = message || "";
  $("start").hidden = s !== "ready";
  $("retry").hidden = s !== "stuck";
  $("pause").hidden = ["ready", "ended", "disconnected"].includes(s);
  $("pause").textContent = s === "paused" ? "Resume" : "Pause";
  if (current && s === "paused" && current.left === null) {
    // Pausing loses nothing: the clip and its clock both stop where they are.
    current.left = current.endsAt - performance.now();
    clearTimeout(current.timer);
    if (current.audio) current.audio.pause();
  } else if (current && s !== "paused" && current.left !== null) {
    arm(current.left);
    if (current.audio) current.audio.play().catch(() => {});
  }
  if (s === "ended" || s === "disconnected") { queue.length = 0; if (current) current.done(); }
}

// Failures are shown where the room can see them.
function notice(text) {
  const div = document.createElement("div");
  div.textContent = text;
  $("notices").appendChild(div);
  setTimeout(() => div.remove(), 15000);
}

async function showFigure(code, onFail) {
  const fig = $("fig");
  if (!code) { $("stage").classList.remove("has-figure"); fig.textContent = ""; return; }
  try {
    await mermaid.parse(code);                       // throws on bad syntax, renders nothing
    const { svg } = await mermaid.render(`f${++figureSeq}`, code);
    fig.innerHTML = svg;
  } catch (e) {
    // A diagram that fails to draw is visibly a failure, never a blank space,
    // and the lecture is told, so the lecturer can draw it again.
    const error = String(e.message || e).slice(0, 300);
    fig.textContent = "";
    const div = document.createElement("div");
    div.className = "figure-error";
    div.textContent = "This diagram couldn't be drawn:\n" + error;
    fig.appendChild(div);
    onFail(error);
  }
  $("stage").classList.add("has-figure");
}

function showPlace() {
  if (!place) { $("place").textContent = ""; return; }
  $("place").textContent = `${place.index + 1} / ${place.of}` + (place.detour ? " · detour" : "")
    + (place.floor ? " · end of the main line" : "");
}

function showSlide(slide) {
  $("title").textContent = slide.title;
  $("body").textContent = slide.text || "";
  $("code").textContent = slide.code || "";
  $("sources").textContent = (slide.sources || []).length ? "Sources: " + slide.sources.join(" · ") : "";
  $("caption").textContent = "";
  showFigure(slide.diagram, error => send({cmd: "slide_failed", revision: slide.revision, error}));
}

// The timer ends a clip that has no sound, and is the watchdog for one that has:
// a clip that fires no events can't hold the queue.
function arm(ms) {
  clearTimeout(current.timer);
  current.left = null;
  current.endsAt = performance.now() + ms;
  current.timer = setTimeout(current.done, ms);
}

function playNext() {
  if (current || !queue.length) return;
  const item = queue.shift();
  $("caption").textContent = item.text;
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    clearTimeout(current.timer);
    if (current.audio) current.audio.pause();
    current = null;
    playNext();
  };
  current = { audio: null, timer: null, endsAt: 0, left: null, done };
  // The words can always be read. With the sound off, or a clip the browser can't
  // play, the caption simply stays up for as long as the clip would have taken.
  arm(item.seconds * 1000 + (soundOn ? 1500 : 0));
  if (!soundOn) return;
  const audio = new Audio(URL.createObjectURL(item.blob));
  current.audio = audio;
  audio.onended = done;
  audio.onerror = () => { notice("A clip couldn't be played here. Its words are in the caption."); };
  audio.play().catch(() => {
    // The browser wants a click before it will play sound.
    soundOn = false;
    $("sound").hidden = false;
    if (current && current.audio === audio) { current.audio = null; arm(item.seconds * 1000); }
  });
}

function receive(ev) {
  const m = JSON.parse(ev.data);
  if (m.type === "hello") {
    document.title = m.deck.subject + " · Professor";
    place = m.place ? {...m.place, floor: m.floor} : null;
    showPlace();
    if (m.slide) showSlide(m.slide); else $("title").textContent = m.deck.subject;
    if (m.diagram) showFigure(m.diagram.code, error => send({cmd: "draw_failed", id: m.diagram.id, error}));
    showState(m.state, m.message);
  }
  else if (m.type === "slide") { place = m.place; showPlace(); showSlide(m.slide); }
  else if (m.type === "state") showState(m.state, m.message);
  else if (m.type === "sentence") {
    const bytes = Uint8Array.from(atob(m.audio), c => c.charCodeAt(0));
    queue.push({ text: m.text, seconds: m.seconds, blob: new Blob([bytes], {type: "audio/mpeg"}) });
    // The lecture sends a sentence when the one before it is over. If this page is
    // still on the last one and isn't actually making sound, it has fallen behind
    // (a blocked or stalled clip, a tab in the background), so it catches up now.
    const sounding = current && current.audio && !current.audio.paused && current.audio.currentTime > 0;
    if (current && !sounding) current.done();
    playNext();
  }
  else if (m.type === "diagram") showFigure(m.code, error => send({cmd: "draw_failed", id: m.id, error}));
  else if (m.type === "unspoken") notice("This sentence couldn't be spoken: " + m.text);
  else if (m.type === "floor") { if (place) { place.floor = true; showPlace(); } }
  else if (m.type === "warn") notice(m.message);
}

// A page that loses the lecture says so and keeps trying to get back. Arriving
// again is the same as arriving late: the lecture says where it is now.
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = receive;
  ws.onclose = () => {
    showState("disconnected", "The connection to the lecture was lost. Trying to get it back…");
    setTimeout(connect, 2000);
  };
}
connect();

$("start").onclick = () => send({cmd: "start"});
$("pause").onclick = () => send({cmd: state === "paused" ? "resume" : "pause"});
$("retry").onclick = () => send({cmd: "retry"});
$("sound").onclick = () => { soundOn = true; $("sound").hidden = true; };
</script>
</body>
</html>
